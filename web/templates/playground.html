<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fastpy playground</title>
<style>
:root {
  --bg: #1e1e2e;
  --surface: #181825;
  --border: #313244;
  --text: #cdd6f4;
  --dim: #6c7086;
  --accent: #89b4fa;
  --green: #a6e3a1;
  --red: #f38ba8;
  --yellow: #f9e2af;
  --font: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
}

header .subtitle {
  color: var(--dim);
  font-size: 12px;
}

header .actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

button {
  font-family: var(--font);
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}

button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}

button.primary:hover { opacity: 0.85; }
button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

button.secondary {
  background: transparent;
  color: var(--dim);
}

button.secondary:hover {
  color: var(--text);
  border-color: var(--text);
}

.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.editor-pane, .output-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.editor-pane {
  border-right: 1px solid var(--border);
}

.pane-header {
  padding: 8px 16px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--dim);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.pane-header .status {
  margin-left: auto;
  font-size: 11px;
}

.status.compiling { color: var(--yellow); }
.status.done { color: var(--green); }
.status.error { color: var(--red); }

#editor {
  flex: 1;
  width: 100%;
  background: var(--surface);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  padding: 16px;
  border: none;
  outline: none;
  resize: none;
  tab-size: 4;
}

#output {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  background: var(--surface);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.out-line { color: var(--text); }
.out-prompt { color: var(--accent); }
.out-input { color: var(--text); opacity: 0.7; }
.out-result { color: var(--green); }
.out-error { color: var(--red); }
.out-info { color: var(--dim); font-style: italic; }
.out-timing { color: var(--dim); font-size: 12px; }

.examples {
  padding: 8px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.examples span {
  font-size: 11px;
  color: var(--dim);
  align-self: center;
}

.examples button {
  font-size: 11px;
  padding: 3px 8px;
}

footer {
  padding: 8px 20px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--dim);
  flex-shrink: 0;
}

@media (max-width: 700px) {
  .main { flex-direction: column; }
  .editor-pane { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
}
</style>
</head>
<body>

<header>
  <h1>fastpy</h1>
  <span class="subtitle">Python compiled to native code</span>
  <div class="actions">
    <button class="primary" id="btn-run" onclick="runCode()" title="Ctrl+Enter">
      Run
    </button>
    <button class="secondary" onclick="resetSession()">Reset</button>
  </div>
</header>

<div class="main">
  <div class="editor-pane">
    <div class="pane-header">
      Editor
      <span style="margin-left:auto;font-size:11px;color:var(--dim)">Ctrl+Enter to run</span>
    </div>
    <textarea id="editor" spellcheck="false" autofocus>x = 42
print(x * 2)

def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)

print(fib(10))
</textarea>
    <div class="examples">
      <span>Examples:</span>
      <button class="secondary" onclick="loadExample('hello')">Hello</button>
      <button class="secondary" onclick="loadExample('fib')">Fibonacci</button>
      <button class="secondary" onclick="loadExample('class')">Classes</button>
      <button class="secondary" onclick="loadExample('inherit')">Inheritance</button>
      <button class="secondary" onclick="loadExample('repl')">REPL</button>
    </div>
  </div>

  <div class="output-pane">
    <div class="pane-header">
      Output
      <span class="status" id="status"></span>
    </div>
    <div id="output"><span class="out-info">Press Run or Ctrl+Enter to compile and execute.</span></div>
  </div>
</div>

<footer>
  Each input is compiled to native x86-64 machine code via LLVM and executed.
  No interpreter. ~2s compile time per run.
</footer>

<script>
let sessionId = null;
// Derive API base from the current page URL, ensuring trailing slash.
const BASE = window.location.pathname.replace(/\/?$/, '/');


const EXAMPLES = {
  hello: `print("Hello from fastpy!")
print("This is compiled to native code via LLVM.")

name = "world"
print("Hello, " + name + "!")
`,
  fib: `def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)

i = 0
while i <= 12:
    print(fib(i))
    i = i + 1
`,
  'class': `class Point:
    def __init__(self, x, y):
        self.x = x
        self.y = y

    def distance_to(self, other):
        dx = self.x - other.x
        dy = self.y - other.y
        return (dx * dx + dy * dy) ** 0.5

p1 = Point(0, 0)
p2 = Point(3, 4)
print("Distance: " + str(p1.distance_to(p2)))

p3 = Point(1, 1)
print("Distance p2->p3: " + str(p2.distance_to(p3)))
`,
  inherit: `class Shape:
    def __init__(self, name):
        self.name = name

    def area(self):
        return 0

class Circle(Shape):
    def __init__(self, radius):
        self.name = "circle"
        self.radius = radius

    def area(self):
        return 3.14159 * self.radius * self.radius

class Rectangle(Shape):
    def __init__(self, w, h):
        self.name = "rectangle"
        self.w = w
        self.h = h

    def area(self):
        return self.w * self.h

shapes = [Circle(5.0), Rectangle(3.0, 4.0), Circle(1.0)]
i = 0
while i < len(shapes):
    s = shapes[i]
    print(s.name + " area = " + str(s.area()))
    i = i + 1
`,
  repl: `# REPL mode: each block below runs as a separate REPL input.
# Variables and functions persist across runs.
# Try running these one at a time!

x = 10
y = 20
print(x + y)

def square(n):
    return n * n

print(square(x))
print(square(y))
`,
};

function loadExample(name) {
  document.getElementById('editor').value = EXAMPLES[name] || '';
}

async function runCode() {
  const editor = document.getElementById('editor');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const btn = document.getElementById('btn-run');
  const source = editor.value.trim();

  if (!source) return;

  btn.disabled = true;
  status.className = 'status compiling';
  status.textContent = 'compiling...';

  // Determine mode: if the source has multiple top-level blocks, run
  // as a single program.  Otherwise, run as REPL (line by line).
  // For simplicity, always run as a single program.
  output.innerHTML = '';

  try {
    // Reset session for whole-program mode (each Run is independent).
    sessionId = null;

    // Split into logical blocks for REPL-style execution.
    // A blank line between non-indented lines separates blocks.
    const blocks = splitBlocks(source);

    for (let i = 0; i < blocks.length; i++) {
      const block = blocks[i];
      if (!block.trim()) continue;

      // Show the input
      const lines = block.split('\n');
      for (const line of lines) {
        if (line.startsWith('#')) {
          appendOutput(line, 'out-info');
        } else {
          appendOutput('>>> ' + line, 'out-prompt');
        }
      }

      status.textContent = `compiling (${i + 1}/${blocks.length})...`;

      const resp = await fetch(BASE + 'api/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({source: block, session_id: sessionId}),
      });

      const data = await resp.json();
      sessionId = data.session_id;

      if (data.error) {
        appendOutput(data.error, 'out-error');
        break;
      }
      if (data.output) {
        appendOutput(data.output, 'out-result');
      }
      if (data.elapsed !== undefined) {
        appendOutput(`  (${data.elapsed}s)`, 'out-timing');
      }
    }

    status.className = 'status done';
    status.textContent = 'done';

  } catch (err) {
    appendOutput('Network error: ' + err.message, 'out-error');
    status.className = 'status error';
    status.textContent = 'error';
  } finally {
    btn.disabled = false;
  }
}

function splitBlocks(source) {
  // Split source into REPL blocks separated by blank lines at the
  // top level (not inside indented blocks).
  const lines = source.split('\n');
  const blocks = [];
  let current = [];
  let inBlock = false;  // inside an indented block

  for (const line of lines) {
    const trimmed = line.trimEnd();
    const isIndented = line.startsWith(' ') || line.startsWith('\t');
    const isEmpty = trimmed === '';
    const isComment = trimmed.startsWith('#');

    if (isEmpty && !inBlock && current.length > 0) {
      // Blank line at top level — end current block.
      blocks.push(current.join('\n'));
      current = [];
      continue;
    }

    if (isEmpty && inBlock) {
      // Blank line inside block — might end the block.
      // Peek ahead: if next non-empty line is indented, continue block.
      inBlock = false;
      current.push(line);
      continue;
    }

    if (isComment && current.length === 0) {
      // Standalone comment line — pass through.
      blocks.push(trimmed);
      continue;
    }

    current.push(line);

    if (trimmed.endsWith(':') || isIndented) {
      inBlock = true;
    } else if (!isIndented && !isEmpty) {
      inBlock = false;
    }
  }

  if (current.length > 0) {
    blocks.push(current.join('\n'));
  }

  return blocks;
}

function appendOutput(text, cls) {
  const output = document.getElementById('output');
  const span = document.createElement('span');
  span.className = cls || 'out-line';
  span.textContent = text + '\n';
  output.appendChild(span);
  output.scrollTop = output.scrollHeight;
}

async function resetSession() {
  if (sessionId) {
    fetch(BASE + 'api/reset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sessionId}),
    });
  }
  sessionId = null;
  document.getElementById('output').innerHTML =
    '<span class="out-info">Session reset. Press Run to start fresh.</span>';
  document.getElementById('status').textContent = '';
}

// Keyboard shortcut: Ctrl+Enter to run.
document.getElementById('editor').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    runCode();
  }
  // Tab inserts spaces instead of changing focus.
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
  }
});
</script>

</body>
</html>
